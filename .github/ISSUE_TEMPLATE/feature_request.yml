name: Feature request
description: An idea for the engine, the server or the chat page
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem or the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. How you picture it, and anything you've seen elsewhere (llama.cpp, Ollama, vLLM).
