[package]
name = "ghost-infer"
version = "0.1.0"
edition = "2024"
description = "Fast local LLM inference for consumer GPUs: GGUF models, an OpenAI-compatible server and a chat page"
license = "MIT OR Apache-2.0"
repository = "https://github.com/affifuddin-hazam/ghost-infer"

[workspace]
# the engine and server stay at the root; the native desktop app is its own crate (it brings the GUI crates)
members = [".", "app"]

[dependencies]
memmap2 = "0.9"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
