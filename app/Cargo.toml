[package]
name = "ghost-app"
version = "0.1.1"
edition = "2024"
description = "ghost-infer's native desktop app: a light window onto the local ghost-infer server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/affifuddin-hazam/ghost-infer"

[[bin]]
name = "ghost-app"
path = "src/main.rs"

[dependencies]
# drawn on the CPU (tiny-skia): no GPU memory taken from the model, about 16 MB idle
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "thread-pool", "markdown", "highlighter", "canvas", "selector"] }
# Windows' own folder dialog, for the folders the model may use
rfd = "0.17"

# the preview pane: Edge's WebView2 (part of Windows 10 and 11) as a child of the app's window, made only
# when a page is shown
[target.'cfg(windows)'.dependencies]
wry = "0.55"
# the ghost by the clock, where the window's X hides it
tray-icon = "0.25"
