<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>README stats mockup</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .page { padding: 32px 16px; }
  .dark { background: #0d1117; color: #e6edf3; }
  .light { background: #ffffff; color: #1f2328; }
  .readme { max-width: 896px; margin: 0 auto; }
  h2 { font-size: 24px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
  .light h2 { border-color: #d1d9e0; }
  img { display: block; max-width: 100%; height: auto; margin: 16px auto; }
  .tag { font-size: 12px; opacity: .6; text-align: center; }
  button { margin: 0 auto 8px; display: block; padding: 6px 12px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; }
</style>
</head>
<body>
  <div class="page dark">
    <div class="readme" id="cards">
      <p class="tag">GitHub dark theme</p>
      <button onclick="replay()">Replay animations</button>
    </div>
  </div>
  <div class="page light">
    <div class="readme" id="cards-light">
      <p class="tag">GitHub light theme</p>
    </div>
  </div>
<script>
  // the engine first, then the harness
  const CARDS = [
    [null, 'stats.svg'],
    ['Speed', 'race.svg'],
    ['Models bigger than your GPU', 'experts.svg'],
    ['Long chats stay fast', 'long.svg'],
    ['Exact speculative decoding', 'exact.svg'],
    ['A drop-in server', 'server.svg'],
    ['One small program', 'small.svg'],
    ['harness', null],
    ['It learns while you sleep', 'sleep.svg'],
    ['It builds its own tools', 'plugins.svg'],
  ];
  for (const id of ['cards', 'cards-light']) {
    const box = document.getElementById(id);
    for (const [title, src] of CARDS) {
      if (title === 'harness') { const p = document.createElement('p'); p.className = 'tag'; p.textContent = 'the harness (next)'; box.append(p); continue; }
      if (title) { const h = document.createElement('h2'); h.textContent = title; box.append(h); }
      const img = document.createElement('img'); img.src = src; img.alt = ''; box.append(img);
    }
  }
  function replay() {
    for (const img of document.querySelectorAll('img')) {
      const base = img.getAttribute('src').split('?')[0];
      img.src = base + '?' + Date.now();
    }
  }
</script>
</body>
</html>
