      <path d="M-22,10 V-12 A22,22 0 0 1 22,-12 V10 L15,4 L8,10 L0,4 L-8,10 L-15,4 Z" fill="none" stroke="#7ee2b8" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="-8" cy="-10" r="3" fill="#7ee2b8"/><circle cx="8" cy="-10" r="3" fill="#7ee2b8"/>
    </g>
    <text class="t k" x="520" y="256" text-anchor="middle" style="fill:#c9d1d9">ghost-infer.exe</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3583;0.3683;0.9667;0.9917;1.0000" dur="12.0s" repeatCount="indefinite"/>
    <text class="t big" x="604" y="160">3.8 MB</text>
    <text class="t box" x="606" y="188">one file, written in Rust</text>
    <text class="t box" x="606" y="210">2 dependencies: <tspan class="gr">memmap2</tspan> and <tspan class="gr">rayon</tspan></text>
    <text class="t box" x="606" y="232">nothing else to install</text>
  </g>
  <rect x="24" y="284" width="812" height="100" rx="8" fill="#010409" stroke="#30363d"/>
  <circle cx="40" cy="298" r="4" fill="#30363d"/><circle cx="54" cy="298" r="4" fill="#30363d"/><circle cx="68" cy="298" r="4" fill="#30363d"/>
  <clipPath id="tl0"><rect x="36" y="309" height="18" width="0"><animate attributeName="width" values="0;0;800;800;0;0" keyTimes="0.0000;0.4167;0.5333;0.9667;0.9675;1.0000" dur="12.0s" repeatCount="indefinite"/></rect></clipPath>
  <text class="m term" x="38" y="322" clip-path="url(#tl0)"><tspan class="gr">&gt;</tspan> ghost-infer serve Qwen3-4B-Instruct-2507-Q4_K_M.gguf --gpu</text>
  <clipPath id="tl1"><rect x="36" y="327" height="18" width="0"><animate attributeName="width" values="0;0;800;800;0;0" keyTimes="0.0000;0.5750;0.6167;0.9667;0.9675;1.0000" dur="12.0s" repeatCount="indefinite"/></rect></clipPath>
  <text class="m term" x="38" y="340" clip-path="url(#tl1)"><tspan class="dim">[loaded Qwen3-4B-Instruct-2507 on GPU NVIDIA GeForce RTX 2060 SUPER in 1.1s]</tspan></text>
  <clipPath id="tl2"><rect x="36" y="345" height="18" width="0"><animate attributeName="width" values="0;0;800;800;0;0" keyTimes="0.0000;0.6250;0.6583;0.9667;0.9675;1.0000" dur="12.0s" repeatCount="indefinite"/></rect></clipPath>
  <text class="m term" x="38" y="358" clip-path="url(#tl2)">chat in your browser: <tspan class="gr">http://127.0.0.1:8080/</tspan></text>
