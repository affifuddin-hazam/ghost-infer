  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3250;0.3350;0.9667;0.9917;1.0000" dur="12.0s" repeatCount="indefinite"/>
    <rect x="468" y="104" width="104" height="132" rx="10" fill="#7ee2b8" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;0;0.55;0.0;0" keyTimes="0.0000;0.3250;0.3417;0.4083;1.0000" dur="12.0s" repeatCount="indefinite"/></rect>
    <path d="M478,104 H542 L572,134 V226 Q572,236 562,236 H478 Q468,236 468,226 V114 Q468,104 478,104 Z" fill="#161b22" stroke="#7ee2b8" stroke-width="1.8"/>
    <path d="M542,104 V126 Q542,134 550,134 H572" fill="none" stroke="#7ee2b8" stroke-width="1.8"/>
