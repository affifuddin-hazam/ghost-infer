<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="ghost-infer is one small program: instead of Python, pip packages, a CUDA toolkit and Docker, one 3.8 MB file with two dependencies that starts a server">
  <style>
    .t  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m  { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    .h  { font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .s  { font-size: 12px; fill: #8b949e; }
    .k  { font-size: 11px; fill: #8b949e; }
    .box { font-size: 13px; fill: #c9d1d9; }
    .big { font-size: 44px; font-weight: 800; fill: #7ee2b8; letter-spacing: -1px; }
    .term { font-size: 12.5px; fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .gr { fill: #7ee2b8; }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="399" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text class="t h" x="24" y="40">One small program</text>
  <text class="t s" x="24" y="62">No Python, no Docker, no CUDA toolkit to install: one file that compiles its GPU code for your card on first start.</text>
  <text class="t k" x="24" y="98">what a local AI setup often asks for<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0.0000;0.2833;0.3333;0.9917;1.0000" dur="12.0s" repeatCount="indefinite"/></text>
  <text class="t box" x="354" y="166" text-anchor="end" opacity="0" style="fill:#8b949e">all of that,<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3667;0.3767;0.9667;0.9917;1.0000" dur="12.0s" repeatCount="indefinite"/></text>
  <text class="t box" x="354" y="186" text-anchor="end" opacity="0" style="fill:#8b949e">in one file<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3833;0.3933;0.9667;0.9917;1.0000" dur="12.0s" repeatCount="indefinite"/></text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0250;0.0458;0.3100;0.3683;1.0000" dur="12.0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0;330 0;330 0" keyTimes="0;0.0250;0.0500;0.3100;0.3683;1" dur="12.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1;0 0 1 1;0.6 0 0.9 0.6;0 0 1 1"/>
    <rect x="24" y="108" width="330" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="40" cy="122" r="3.5" fill="#6e7681"/>
    <text class="t box" x="52" y="127">Python and a virtual environment</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0625;0.0833;0.3033;0.3617;1.0000" dur="12.0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0;330 0;330 0" keyTimes="0;0.0625;0.0875;0.3033;0.3617;1" dur="12.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1;0 0 1 1;0.6 0 0.9 0.6;0 0 1 1"/>
    <rect x="24" y="142" width="330" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="40" cy="156" r="3.5" fill="#6e7681"/>
    <text class="t box" x="52" y="161">pip install torch (the CUDA build)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1000;0.1208;0.2967;0.3550;1.0000" dur="12.0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0;330 0;330 0" keyTimes="0;0.1000;0.1250;0.2967;0.3550;1" dur="12.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1;0 0 1 1;0.6 0 0.9 0.6;0 0 1 1"/>
    <rect x="24" y="176" width="330" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="40" cy="190" r="3.5" fill="#6e7681"/>
    <text class="t box" x="52" y="195">the CUDA toolkit</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1375;0.1583;0.2900;0.3483;1.0000" dur="12.0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0;330 0;330 0" keyTimes="0;0.1375;0.1625;0.2900;0.3483;1" dur="12.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1;0 0 1 1;0.6 0 0.9 0.6;0 0 1 1"/>
    <rect x="24" y="210" width="330" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="40" cy="224" r="3.5" fill="#6e7681"/>
    <text class="t box" x="52" y="229">Docker Desktop</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1750;0.1958;0.2833;0.3417;1.0000" dur="12.0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -14;0 -14;0 0;0 0;330 0;330 0" keyTimes="0;0.1750;0.2000;0.2833;0.3417;1" dur="12.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1;0 0 1 1;0.6 0 0.9 0.6;0 0 1 1"/>
    <rect x="24" y="244" width="330" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="40" cy="258" r="3.5" fill="#6e7681"/>
    <text class="t box" x="52" y="263">a web UI, and its own server</text>
  </g>
