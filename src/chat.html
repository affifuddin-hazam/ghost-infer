<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghost-infer</title>
<style>
  @font-face { font-family: "Instrument Sans"; src: url("/vendor/instrument-sans-5.3.0.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Instrument Sans"; src: url("/vendor/instrument-sans-italic-5.3.0.woff2") format("woff2"); font-weight: 400 700; font-style: italic; font-display: swap; }
  :root {
    --side: #10141f; --bg: #151a27; --raise: #1c2232; --raise-2: #232a3d; --line: rgba(233, 237, 247, 0.08); --line-2: rgba(233, 237, 247, 0.15);
    --text: #e8ebf3; --muted: #8e96ab; --faint: #646c82; --accent: #b9c7ff; --accent-ink: #121726; --accent-soft: rgba(185, 199, 255, 0.12); --danger: #ff9b8a;
    --code: #0f131d;
    --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
    --column: min(760px, calc(100% - 48px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15.5px/1.65 var(--sans); display: grid; grid-template-columns: 272px minmax(0, 1fr); overflow: hidden;
         -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { flex: none; }
  .ibtn { width: 34px; height: 34px; border: 0; border-radius: 9px; background: none; color: var(--muted); display: grid; place-items: center; }
  .ibtn:hover { background: var(--raise-2); color: var(--text); }

  /* ---- sidebar: brand, new chat, saved conversations, the model */
  aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px 18px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .brand svg { color: var(--text); }
  .brand .ibtn { margin-left: auto; display: none; }
  .new { margin: 0 12px 10px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--raise); font-weight: 500; font-size: 14.5px; }
  .new:hover { background: var(--raise-2); }
  .chats { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .group { font-size: 12.5px; color: var(--faint); font-weight: 500; padding: 14px 10px 6px; }
  .chat { position: relative; display: flex; align-items: center; border-radius: 8px; }
  .chat button.open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 7px 34px 7px 10px; font-size: 14px; color: var(--muted);
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 8px; }
  .chat:hover button.open { background: var(--raise); color: var(--text); }
  .chat.current button.open { background: var(--raise-2); color: var(--text); }
  .chat .del { position: absolute; right: 4px; width: 26px; height: 26px; border-radius: 6px; opacity: 0; }
  .chat:hover .del, .chat .del:focus-visible { opacity: 1; }
  .none { color: var(--faint); font-size: 13.5px; padding: 10px; }
  .machine { border-top: 1px solid var(--line); padding: 10px 8px; }
  .machine button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--muted); text-align: left; }
  .machine button:hover, .machine button[aria-expanded="true"] { background: var(--raise); color: var(--text); }
  .tag { font: 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 5px; white-space: nowrap; }

  /* ---- the conversation */
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { flex: none; height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 14px; }
  .top .ibtn { display: none; }
  .title { font-size: 14.5px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
  .scroll { flex: 1; overflow-y: auto; scrollbar-gutter: stable both-edges; }
  .column { width: var(--column); margin: 0 auto; padding: 8px 0 200px; }
  .welcome { min-height: calc(100vh - 330px); display: flex; flex-direction: column; justify-content: center; padding-bottom: 40px; }
  .welcome h1 { font-size: 30px; line-height: 1.2; font-weight: 560; letter-spacing: -0.02em; margin: 0 0 8px; }
  .welcome p { color: var(--muted); margin: 0 0 22px; font-size: 16px; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; }
  .starters button { border: 1px solid var(--line-2); background: none; border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--muted); }
  .starters button:hover { color: var(--text); background: var(--raise); }

  .msg { margin: 0 0 28px; overflow-wrap: anywhere; }
  .msg.user { display: flex; justify-content: flex-end; margin-bottom: 22px; }
  .msg.user .bubble { background: var(--raise-2); padding: 10px 16px; border-radius: 18px 18px 6px 18px; white-space: pre-wrap; max-width: 82%; }
  .answer > :first-child { margin-top: 0; }
  .answer > :last-child { margin-bottom: 0; }
  .answer p { margin: 0 0 14px; }
  .answer h1, .answer h2, .answer h3 { font-size: 17px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; margin: 24px 0 8px; }
  .answer ul, .answer ol { margin: 4px 0 14px; padding-left: 22px; }
  .answer li { margin: 4px 0; }
  .answer li::marker { color: var(--muted); }
  .answer strong { font-weight: 600; }
  .answer hr { border: 0; border-top: 1px solid var(--line-2); margin: 20px 0; }
  .answer a { color: var(--accent); text-underline-offset: 2px; }
  .answer code { background: var(--raise-2); border-radius: 5px; padding: 1.5px 5px; font: 13.5px/1.5 var(--mono); font-variant-ligatures: none; } /* -> stays -> */
  .code { background: var(--code); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 16px; overflow: hidden; }
  .code-top { display: flex; align-items: center; justify-content: space-between; padding: 3px 6px 3px 14px; background: var(--raise); font-size: 12.5px; color: var(--muted); }
  .copy { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 6px 8px; border-radius: 6px; }
  .copy:hover { color: var(--text); background: var(--raise-2); }
  .code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
  .code pre code { background: none; padding: 0; font: 13.5px/1.6 var(--mono); font-variant-ligatures: none; white-space: pre; overflow-wrap: normal; }
  .table { overflow-x: auto; margin: 10px 0 16px; border: 1px solid var(--line-2); border-radius: 10px; }
  .table table { border-collapse: collapse; font-size: 14.5px; width: 100%; }
  .table th, .table td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  .table tr:last-child td { border-bottom: 0; }
  .table th { font-weight: 600; background: var(--raise); }
  details.think { margin: 0 0 12px; }
  details.think summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  details.think summary::-webkit-details-marker { display: none; }
  details.think summary::after { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); margin-left: 2px; transition: transform 0.15s; }
  details.think[open] summary::after { transform: rotate(45deg) translate(-2px, -1px); }
  details.think summary:hover { color: var(--text); }
  details.think .body { white-space: pre-wrap; margin-top: 8px; padding-left: 14px; border-left: 2px solid var(--line-2); color: var(--muted); font-size: 14px; }
  .error { margin-top: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: rgba(255, 155, 138, 0.08); border: 1px solid rgba(255, 155, 138, 0.25); color: var(--danger); font-size: 14.5px; }
  .error button { border: 1px solid rgba(255, 155, 138, 0.4); background: none; color: var(--danger); border-radius: 8px; padding: 4px 12px; font-size: 13.5px; }
  .actions { display: flex; align-items: center; gap: 2px; margin: 8px 0 0 -8px; opacity: 0; transition: opacity 0.15s; }
  .msg:hover .actions, .msg.last .actions, .actions:focus-within { opacity: 1; }
  .actions .ibtn { width: 30px; height: 30px; }
  .actions .stat { font-size: 12.5px; color: var(--faint); margin-left: 8px; font-variant-numeric: tabular-nums; }

  /* ---- the dock: the ghost sits on the message box; its canvas reaches below the box's top edge so the hem tucks behind it */
  .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 10px; pointer-events: none;
          background: linear-gradient(to bottom, rgba(21, 26, 39, 0), var(--bg) 34%); }
  .dock > * { width: var(--column); margin: 0 auto; }
  .perch { position: relative; height: 62px; }
  canvas#ghost { position: absolute; left: 0; bottom: -10px; width: 160px; height: 120px; display: block; }
  .status { position: absolute; left: 92px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); white-space: nowrap; transition: opacity 0.2s; }
  .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status.quiet { opacity: 0; }
  .status.error { color: var(--danger); }
  .status.error i { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .speed { color: var(--text); font-variant-numeric: tabular-nums; }
  body.noghost .status { left: 4px; }
  .composer { position: relative; pointer-events: auto; border-radius: 22px; background: var(--raise); border: 1px solid var(--line-2); box-shadow: 0 16px 40px -18px rgba(0, 0, 0, 0.8); }
  .composer:focus-within { border-color: rgba(185, 199, 255, 0.4); }
  .composer textarea { display: block; width: 100%; border: 0; outline: none; resize: none; background: transparent; min-height: 52px; max-height: 40vh; padding: 14px 18px 4px; line-height: 1.55; }
  .composer textarea::placeholder { color: var(--faint); }
  .tools { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 10px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: none; border-radius: 999px; padding: 5px 12px 5px 9px; font-size: 13.5px; color: var(--muted); }
  .pill:hover { color: var(--text); }
  .pill[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: rgba(185, 199, 255, 0.3); }
  /* the model picker: which GGUF in the models folder answers; switching reloads the server's model */
  .picker { position: relative; min-width: 0; }
  .pill.model { max-width: 100%; color: var(--text); }
  .pill.model > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill.model.down { color: var(--danger); }
  .pill.model:disabled { cursor: default; color: var(--muted); }
  .models { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 4; width: min(380px, calc(100vw - 32px)); padding: 6px; border-radius: 14px;
            background: var(--raise-2); border: 1px solid var(--line-2); box-shadow: 0 24px 50px -20px rgba(0, 0, 0, 0.85); }
  .models p { margin: 4px 10px 8px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .models button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; align-items: center; gap: 10px; border: 0; background: none; border-radius: 9px; padding: 8px 10px; text-align: left; }
  .models button:hover, .models button:focus-visible { background: var(--raise); }
  .models .mname { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .models .msize { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .models .mname .tag { margin-left: 8px; }
  .models svg { color: var(--accent); }
  .send { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .send:disabled { background: var(--raise-2); color: var(--faint); cursor: default; }
  .send.stop { background: var(--text); color: var(--accent-ink); }
  .note { text-align: center; font-size: 12px; color: var(--faint); padding-top: 8px; }

  /* ---- settings */
  .settings { position: fixed; left: 12px; bottom: 70px; z-index: 8; width: min(340px, calc(100vw - 24px)); padding: 18px; border-radius: 14px; display: none;
              background: var(--raise); border: 1px solid var(--line-2); box-shadow: 0 24px 50px -20px rgba(0, 0, 0, 0.8); }
  .settings.open { display: block; }
  .settings h2 { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
  .field { display: grid; gap: 6px; margin-bottom: 16px; font-size: 14px; }
  .field .row { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
  .field .row span:first-child { color: var(--text); }
  .field input[type=range] { accent-color: var(--accent); width: 100%; }
  .field textarea { background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; resize: vertical; min-height: 64px; font-size: 14px; }
  .field small, .check small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .check input { accent-color: var(--accent); margin-top: 4px; }
  .scrim { display: none; }

  @media (max-width: 820px) {
    :root { --column: calc(100% - 28px); }
    body { grid-template-columns: minmax(0, 1fr); }
    aside { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 7; transform: translateX(-100%); transition: transform 0.22s ease; }
    body.menu aside { transform: none; }
    body.menu .scrim { display: block; position: fixed; inset: 0; z-index: 6; background: rgba(5, 7, 12, 0.55); }
    .brand .ibtn, .top .ibtn { display: grid; }
    .top { padding: 0 8px; }
    .dock { padding: 0 0 8px; }
    .welcome h1 { font-size: 25px; }
    .note { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { aside, .actions, .status { transition: none; } }
</style>

<body>
<aside id="side" aria-label="Conversations">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 19V10a7 7 0 0 1 14 0v9l-2.3-1.6L13.3 19 11 17.4 8.7 19l-2.4-1.6Z" fill="currentColor"/><ellipse cx="8.6" cy="10.5" rx="1.1" ry="1.5" fill="#10141f"/><ellipse cx="13.4" cy="10.5" rx="1.1" ry="1.5" fill="#10141f"/></svg>
    ghost-infer
    <button class="ibtn" id="closeMenu" aria-label="Close the menu"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>
  <button class="new" id="newBtn"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>New chat</button>
  <nav class="chats" id="chats" aria-label="Saved conversations"></nav>

      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h8M15 6h1M4 14h1M8 14h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="13.5" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="6.5" cy="14" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      Reply settings
    </button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<section class="settings" id="settings" aria-label="Settings">
  <h2>Reply settings</h2>
  <label class="field"><span class="row"><span>Temperature</span><span id="tempVal"></span></span><input type="range" id="temp" min="0" max="2" step="0.1" value="0"><small>0 gives the same answer every time and is fastest (it uses the draft model if the server has one).</small></label>
  <label class="field"><span class="row"><span>Longest reply</span><span id="maxVal"></span></span><input type="range" id="maxTokens" min="64" max="8192" step="64" value="2048"></label>
  <label class="field"><span class="row"><span>System prompt</span></span><textarea id="system" placeholder="Leave empty to use the model's default"></textarea></label>

<script type="module">
"use strict";
const $ = (id) => document.getElementById(id);

// ================================================================ the ghost
// A small 3D ghost drawn in code (three.js), sitting on the message box: every state is a set of pose targets the
// animation eases toward, so changes always blend. ghost.set(state), ghost.token() on each streamed token, ghost.rate(tok/s).
const ghost = await (async () => {
  let THREE;
  try { THREE = await import("three"); } catch { return null; }
  const canvas = $("ghost");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch { return null; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
  const scene = new THREE.Scene();
  // framed so the ghost stands in the canvas's left part with its hem just above the box's edge, leaving room
  // above and to the right for raised arms, the magnifier and the z / ? / steam effects
  const camera = new THREE.PerspectiveCamera(32, 4 / 3, 0.1, 100);
  camera.position.set(2.0, 0.69, 10.5);
  scene.add(new THREE.HemisphereLight(0xf2f5ff, 0x3a4566, 1.7));
  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(-3, 5, 6);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fb2ff, 1.2);
  rim.position.set(4, 2, -5);
  scene.add(rim);

  const root = new THREE.Group(); // floats and leans
  const body = new THREE.Group(); // squash and stretch
  root.add(body);
  scene.add(root);

  // body: a lathe dome with straight sides; the hem is waved per frame
  const R = 1.25, H = 1.55;
  const prof = [];
  for (let i = 0; i <= 24; i++) { const a = (i / 24) * Math.PI / 2; prof.push(new THREE.Vector2(Math.sin(a) * R + 1e-4, Math.cos(a) * R)); }
  for (let i = 1; i <= 12; i++) prof.push(new THREE.Vector2(R * (1 + 0.05 * i / 12), -H * (i / 12)));
  prof.reverse(); // hem to top: the lathe's faces then point outward
  const geo = new THREE.LatheGeometry(prof, 96);
  const base = geo.attributes.position.array.slice();
  // a soft self-glow keeps it ghostly white under the blue light; working states add to it
  const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85, metalness: 0, emissive: 0xdfe5ff, emissiveIntensity: 0.12, transparent: true, opacity: 1 });
  const inner = new THREE.MeshStandardMaterial({ color: 0x8e99b8, roughness: 0.9, side: THREE.BackSide, transparent: true, opacity: 1 });
  body.add(new THREE.Mesh(geo, white), new THREE.Mesh(geo, inner));

  // face: eyes (oval, happy arc, closed line) with brows for angry / serious / worried faces, mouth, blush
  const dark = new THREE.MeshBasicMaterial({ color: 0x1a2030 });
  const shine = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const face = new THREE.Group();
  face.position.set(0, 0.28, 0);
  body.add(face);

// ================================================================ conversations
const store = {
  get(k, d) { try { const v = localStorage.getItem("ghost-infer." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghost-infer." + k, JSON.stringify(v)); } catch {} },
};
// the project was called betterllama: keep conversations and settings saved under that name
try {
  for (const k of Object.keys(localStorage).filter((k) => k.startsWith("betterllama."))) {
    const to = "ghost-infer." + k.slice(12);
    if (localStorage.getItem(to) === null) localStorage.setItem(to, localStorage.getItem(k));
    localStorage.removeItem(k);
  }
} catch {}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const blank = () => ({ id: uid(), title: "", messages: [], at: Date.now() });
function titleOf(messages) {
  const u = messages.find((m) => m.role === "user");
  if (!u) return "";
  const line = u.content.trim().split("\n")[0];
  return line.length > 60 ? line.slice(0, 57).trimEnd() + "…" : line;
}
// each conversation: {id, title, at, messages: [{role, content, sent?, think?, thinkSecs?, meta?, error?}]}
let chats = store.get("chats", null);
if (!Array.isArray(chats)) { // the page used to keep a single conversation
  const old = store.get("messages", []);
  chats = old.length ? [{ id: uid(), title: titleOf(old), messages: old, at: Date.now() }] : [];
  store.set("chats", chats);
}
let chat = chats.find((c) => c.id === store.get("current", null)) || chats[0] || blank(); // a new chat joins the list when it gets its first message
let busy = null; // AbortController of the running request
let settle = null; // timer back to idle after a reply's mood
let lastActive = performance.now();
function save() { store.set("chats", chats); store.set("current", chat.id); }

};

// ---- the ghost's status line: quiet unless something is happening
const LABELS = { thinking: "Thinking", talking: "Writing", cheerful: "Writing", tool: "Using a tool", wave: "Hello" };
function mood(s, label, error = false) {
  ghost?.set(s);
  const text = label ?? LABELS[s] ?? "";
  $("statusText").textContent = text;
  $("status").classList.toggle("quiet", !text);
  $("status").classList.toggle("error", error);
}
// after a reply or an error: hold the face a moment, then rest
function settleTo(s, ms, label, error = false) {
  clearTimeout(settle);
  mood(s, label, error);
  settle = setTimeout(() => { if (!busy) mood($("input").value.trim() ? "listening" : "idle"); }, ms);
}
// nobody around for two minutes: doze off; any activity wakes it
setInterval(() => { if (!busy && ghost?.state === "idle" && performance.now() - lastActive > 120000) mood("sleepy"); }, 5000);
for (const ev of ["pointermove", "keydown", "pointerdown", "wheel"]) addEventListener(ev, () => { lastActive = performance.now(); if (ghost?.state === "sleepy") mood("idle"); });

// ---- settings, kept in this browser

for (const [id, [key, d]] of Object.entries(prefs)) {
  const el = $(id), v = store.get(key, d);
  el.type === "checkbox" ? (el.checked = v) : (el.value = v);
  el.addEventListener("input", () => { store.set(key, el.type === "checkbox" ? el.checked : el.value); showSettings(); });
}
think.setAttribute("aria-pressed", String(store.get("think", true)));
think.onclick = () => { const on = think.getAttribute("aria-pressed") !== "true"; think.setAttribute("aria-pressed", String(on)); store.set("think", on); };
function showSettings() {
  $("tempVal").textContent = Number($("temp").value).toFixed(1);
  $("maxVal").textContent = Number($("maxTokens").value).toLocaleString() + " tokens";
}

function openSettings(on) { $("settings").classList.toggle("open", on); $("settingsBtn").setAttribute("aria-expanded", String(on)); }
$("settingsBtn").onclick = (e) => { e.stopPropagation(); openSettings(!$("settings").classList.contains("open")); };

addEventListener("keydown", (e) => { if (e.key === "Escape") { openSettings(false); menu(false); closeModels(); } });

function renderChats() {
  const nav = $("chats");
  nav.innerHTML = "";
  if (!chats.length) { nav.innerHTML = '<p class="none">Your conversations will show up here.</p>'; return; }
  const today = new Date().setHours(0, 0, 0, 0), day = 86400000;
  const groupOf = (at) => at >= today ? "Today" : at >= today - day ? "Yesterday" : at >= today - 7 * day ? "Previous 7 days" : "Older";
  let group = null;
  for (const c of [...chats].sort((a, b) => b.at - a.at)) {
    if (groupOf(c.at) !== group) {
      group = groupOf(c.at);
      const h = document.createElement("div");
      h.className = "group"; h.textContent = group;
      nav.appendChild(h);
    }
    const row = document.createElement("div");
    row.className = "chat" + (c === chat ? " current" : "");
    const open = document.createElement("button");
    open.className = "open"; open.textContent = open.title = c.title || "New chat";
    if (c === chat) open.setAttribute("aria-current", "true");
    open.onclick = () => switchTo(c);
    const del = document.createElement("button");
    del.className = "ibtn del"; del.innerHTML = ICON.trash; del.title = "Delete"; del.setAttribute("aria-label", `Delete ${c.title || "this chat"}`);
    del.onclick = () => remove(c);
    row.append(open, del);
    nav.appendChild(row);
  }
}
function switchTo(c) {
  if (busy) busy.abort();
  chat = c;
  save(); renderChats(); renderAll(); menu(false);
  $("input").focus();
}
function remove(c) {
  if (!confirm(`Delete "${c.title || "this chat"}"? This can't be undone.`)) return;
  chats = chats.filter((x) => x !== c);
  if (c === chat) { if (busy) busy.abort(); chat = blank(); renderAll(); }
  save(); renderChats();
}
$("newBtn").onclick = () => {
  if (!chat.messages.length) { menu(false); $("input").focus(); return; }
  switchTo(blank());
  settleTo("wave", 2200);
};

// ---- the model picker: the GGUF files in the server's models folder; choosing one makes the server switch to it.
// Models are named the way people say them: "JOSIEFIED-Qwen3-8B-Q4_K_M" is JOSIEFIED Qwen3 8B, quantized Q4_K_M.
const pretty = (id) => {
  const m = id.match(/^(.*?)[-_.]((?:I?Q\d\w*)|F16|BF16|F32)$/i);
  return { name: (m ? m[1] : id).replace(/[-_]+/g, " "), quant: m ? m[2].toUpperCase() : "" };
};
const size = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : Math.round(n / 1e6) + " MB";
let model = null, loadingModel = null; // the server's model, and the one it is switching to
function showModel() {
  const b = $("modelBtn");
  b.classList.remove("down");
  b.disabled = !!loadingModel;
  $("modelName").textContent = loadingModel ? `Loading ${pretty(loadingModel).name}…` : model ? pretty(model).name : "No model";
  b.title = model ? `${model}: choose another model` : "Choose the model";
  canSend();
}
async function refreshModels() {
  try {
    const j = await (await fetch("/api/models")).json();
    model = j.current; loadingModel = j.loading;
    showModel();
    if (loadingModel) setTimeout(refreshModels, 1500); // a switch is under way (another tab, or the server starting): watch it finish
    return j;
  } catch {
    model = loadingModel = null;
    showModel();
    $("modelName").textContent = "Server not reachable";
    $("modelBtn").classList.add("down");
  }
}
function closeModels() { $("models").hidden = true; $("modelBtn").setAttribute("aria-expanded", "false"); }
async function openModels() {
  const menu = $("models");
  if (!menu.hidden) return closeModels();
  const j = await refreshModels();
  if (!j || loadingModel) return;
  menu.innerHTML = "<p>The models in the server's models folder. Switching loads the new one, which can take a minute.</p>";
  for (const m of j.models) {
    const { name, quant } = pretty(m.id);
    const b = document.createElement("button");
    b.type = "button"; b.title = m.id;
    b.innerHTML = `<span class="mname">${esc(name)}${quant ? `<span class="tag">${esc(quant)}</span>` : ""}</span><span class="msize">${size(m.size)}</span>` +
      (m.id === j.current ? ICON.done : "<span></span>");
    if (m.id === j.current) b.setAttribute("aria-current", "true");
    b.onclick = () => { closeModels(); if (m.id !== j.current) switchModel(m.id); };
    menu.appendChild(b);
  }
  menu.hidden = false;
  $("modelBtn").setAttribute("aria-expanded", "true");
  (menu.querySelector("[aria-current]") || menu.querySelector("button"))?.focus();
}
$("modelBtn").onclick = (e) => { e.stopPropagation(); openModels(); };
addEventListener("click", (e) => { if (!$("models").contains(e.target)) closeModels(); });
async function switchModel(id) {
  if (busy || loadingModel) return;
  const name = pretty(id).name, t0 = performance.now();
  loadingModel = id;
  showModel();
  clearTimeout(settle);
  mood("thinking", `Loading ${name}`);
  const tick = setInterval(() => mood("thinking", `Loading ${name}, ${Math.round((performance.now() - t0) / 1000)} s`), 1000);
  try {
    const r = await fetch("/api/models/load", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error?.message || `HTTP ${r.status}`);
    clearInterval(tick);
    await refreshModels();
    settleTo("happy", 2600, `${name} is ready`);
  } catch (e) {
    clearInterval(tick);
    await refreshModels();
    settleTo("confused", 8000, e instanceof TypeError ? "Can't reach the server" : String(e.message || e), true);
  }
}
refreshModels();
addEventListener("focus", () => { if (!loadingModel) refreshModels(); }); // another tab or client may have switched it

// ---- a small Markdown renderer (everything is escaped, so model output can never become HTML)
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
// inline code first, so `a*b*c` stays as written
function inline(s) {
  return s.split(/(`[^`\n]+`)/).map((p, i) => i % 2 ? "<code>" + esc(p.slice(1, -1)) + "</code>" : esc(p)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')).join("");
}
const cells = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
const TABLE_RULE = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/;
function markdown(src) {
  const out = [];
  src.split(/```/).forEach((part, n) => {
    if (n % 2 === 1) { // a code block (possibly still open while streaming); its first line names the language
      const nl = part.indexOf("\n");
      const lang = (nl >= 0 ? part.slice(0, nl) : part).trim();
      const code = nl >= 0 ? part.slice(nl + 1).replace(/\n$/, "") : "";
      out.push(`<div class="code"><div class="code-top"><span>${esc(lang || "code")}</span><button class="copy" type="button">${ICON.copy}<span>Copy</span></button></div><pre><code>${esc(code)}</code></pre></div>`);
      return;
    }
    let list = null, para = [];
    const close = () => { if (list) { out.push("</" + list + ">"); list = null; } };
    const flush = () => { if (para.length) { out.push("<p>" + inline(para.join("\n")).replace(/\n/g, "<br>") + "</p>"); para = []; } };
    const lines = part.split("\n");
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let m;
      if (!line.trim()) { flush(); close(); continue; }
      if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flush(); close(); const h = Math.min(m[1].length, 3); out.push(`<h${h}>${inline(m[2])}</h${h}>`); continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); close(); out.push("<hr>"); continue; }
      if (line.includes("|") && TABLE_RULE.test(lines[i + 1] || "")) {
        flush(); close();
        let html = "<thead><tr>" + cells(line).map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
        for (i += 2; i < lines.length && lines[i].includes("|") && lines[i].trim(); i++) html += "<tr>" + cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>";
        i--;
        out.push(`<div class="table"><table>${html}</tbody></table></div>`);
        continue;
      }
      if ((m = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)/))) {
        flush();
        const kind = /\d/.test(m[1]) ? "ol" : "ul";
        if (list !== kind) { close(); out.push("<" + kind + ">"); list = kind; }
        out.push("<li>" + inline(m[2]) + "</li>");
        continue;
      }
      close();
      para.push(line);
    }
    flush(); close();
  });
  return out.join("");
}

// ---- the conversation
const scroll = $("scroll"), log = $("log");
const STARTERS = [["Explain some code", "Explain what this code does:\n\n"], ["Find a bug", "Find the bug in this code:\n\n"], ["Write a function", "Write a function that "], ["Plan a feature", "Help me plan "]];
function view(m) {
  const div = document.createElement("div");
  div.className = "msg " + m.role;
  if (m.role === "user") {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = m.content;
    div.appendChild(b);
    return div;
  }
  div.innerHTML = '<details class="think" hidden><summary></summary><div class="body"></div></details><div class="answer"></div>' +
    '<div class="error" hidden><span></span><button type="button" class="retry">Try again</button></div>' +
    `<div class="actions"><button type="button" class="ibtn copyall" title="Copy" aria-label="Copy the reply">${ICON.copy}</button>` +
    `<button type="button" class="ibtn retry" title="Write it again" aria-label="Write the reply again">${ICON.retry}</button><span class="stat"></span></div>`;
  div.reply = m;
  fill(div, m);
  return div;
}
function fill(div, m) {
  const th = div.querySelector(".think"), hasThink = !!(m.think && m.think.trim());
  th.hidden = !hasThink;
  if (hasThink) {
    th.querySelector("summary").textContent = m.thinkSecs === undefined ? "Thinking…" : `Thought for ${m.thinkSecs.toFixed(1)} s`;
    th.querySelector(".body").textContent = m.think.trim();
  }
  div.querySelector(".answer").innerHTML = markdown(m.content);
  const err = div.querySelector(".error");
  err.hidden = !m.error;
  err.querySelector("span").textContent = m.error || "";
  const live = busy && div === log.lastElementChild;
  div.querySelector(".actions").hidden = live || !!m.error;
  const stat = div.querySelector(".stat");
  stat.textContent = m.meta === "stopped" ? "Stopped" : (m.meta?.match(/[\d.]+ tok\/s/) || [""])[0];
  stat.title = [m.model && pretty(m.model).name, m.meta].filter(Boolean).join(": ");
}
const nearBottom = () => scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 140;
const toBottom = () => { scroll.scrollTop = scroll.scrollHeight; };
function renderAll() {
  $("title").textContent = chat.title;
  document.title = chat.title ? `${chat.title} - ghost-infer` : "ghost-infer";
  if (!chat.messages.length) {
    log.innerHTML = '<div class="welcome"><h1>What are we working on?</h1><p>Ask a question, or paste code to explain, fix or review.</p><div class="starters"></div></div>';
    for (const [label, text] of STARTERS) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.onclick = () => { input.value = text; input.focus(); input.setSelectionRange(text.length, text.length); typed(); };
      log.querySelector(".starters").appendChild(b);
    }
    return;
  }
  log.replaceChildren(...chat.messages.map(view));
  const last = log.lastElementChild;
  if (last?.classList.contains("assistant")) last.classList.add("last");
  log.querySelectorAll(".msg.assistant:not(.last) .actions .retry").forEach((b) => (b.hidden = true)); // only the last reply can be written again
  toBottom();
}
// while a reply streams, redraw it at most once a frame, following it down unless you scrolled up to read
let drawReq = 0;
function draw(div, m, now = false) {
  if (drawReq) { cancelAnimationFrame(drawReq); drawReq = 0; }
  const run = () => { drawReq = 0; const stick = nearBottom(); fill(div, m); if (stick) toBottom(); };
  now ? run() : (drawReq = requestAnimationFrame(run));
}
// the transcript ends above the ghost and the message box, whatever height the box has grown to
new ResizeObserver(() => {
  const stick = nearBottom();
  log.style.paddingBottom = $("dock").offsetHeight + 16 + "px";
  if (stick) toBottom();
}).observe($("dock"));

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
}
log.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.classList.contains("copy")) {
    await copyText(b.closest(".code").querySelector("code").textContent);
    b.innerHTML = ICON.done + "<span>Copied</span>";
    setTimeout(() => (b.innerHTML = ICON.copy + "<span>Copy</span>"), 1500);
  } else if (b.classList.contains("copyall")) {
    await copyText(b.closest(".msg").reply.content);
    b.innerHTML = ICON.done;
    setTimeout(() => (b.innerHTML = ICON.copy), 1500);
  } else if (b.classList.contains("retry")) retry();
});

// ---- moods: the model starts its reply (or a sentence) with a hidden tag
const MOOD_TAGS = ["happy", "neutral", "serious", "sorry", "surprised", "angry", "confused"];
const MOOD_PROMPT = "You appear to the user as a small ghost whose face follows your mood. Start every reply with one mood tag in square brackets: " +
  MOOD_TAGS.map((t) => `[${t}]`).join(", ") + ". You may put another tag before a sentence where your mood changes. The tags are hidden from the user; never mention them.";
const TAG_RE = new RegExp(`\\[(${MOOD_TAGS.join("|")})\\]\\s*`, "gi");
// the shown text without its tags (and without a tag still being typed at the very end), and the latest mood
function moodOf(answer, streaming) {
  let last = null;
  let shown = answer.replace(TAG_RE, (_, t) => { last = t.toLowerCase(); return ""; });
  if (streaming || /\[[a-z]{0,9}$/i.test(shown.trim())) shown = shown.replace(/\[[a-z]{0,9}\s*$/i, ""); // a tag cut off at the end
  return { shown, last };
}
const TALKING_FACE = { happy: "cheerful", neutral: "talking", serious: "serious", sorry: "sorry", surprised: "surprised", angry: "angry", confused: "confused" };
const AFTER_FACE = { happy: "happy", neutral: "happy", serious: "serious", sorry: "sorry", surprised: "surprised", angry: "angry", confused: "confused" };

// splits the raw reply into its <think> part and the answer
function split(raw, m, t0) {
  const open = raw.indexOf("<think>");
  if (open < 0 || raw.slice(0, open).trim()) { m.answer = raw; return; }
  const close = raw.indexOf("</think>");
  if (close < 0) { m.think = raw.slice(open + 7); m.answer = ""; return; }
  m.think = raw.slice(open + 7, close);
  if (m.thinkSecs === undefined) m.thinkSecs = (performance.now() - t0) / 1000;
  m.answer = raw.slice(close + 8).replace(/^\s+/, "");
}

function send(text) {
  const thinking = think.getAttribute("aria-pressed") === "true";
  // `sent` is what the model reads; resending exactly that keeps the server's cache of the conversation valid
  chat.messages.push({ role: "user", content: text, sent: thinking ? text : text + " /no_think" });
  if (!chats.includes(chat)) { chat.title = titleOf(chat.messages); chats.push(chat); }
  chat.at = Date.now();
  ask(thinking);
}
// the last reply again, from the same question
function retry() {
  if (busy) return;
  const msgs = chat.messages;
  if (msgs.at(-1)?.role === "assistant") msgs.pop();
  if (msgs.at(-1)?.role === "user") ask(!(msgs.at(-1).sent ?? "").endsWith(" /no_think"));
}

async function ask(thinking) {
  clearTimeout(settle);
  const c = chat, reply = { role: "assistant", content: "", model };
  c.messages.push(reply);
  busy = new AbortController();
  setBusy(true);
  mood("thinking", "Reading");
  save(); renderChats(); renderAll();
  const el = log.lastElementChild;

  // earlier replies go back without their thinking (as Qwen3 expects), with their mood tags
  const history = c.messages.slice(0, -1).map((m) => ({ role: m.role, content: m.sent ?? m.content }));
  const sys = [$("system").value.trim(), $("moods").checked ? MOOD_PROMPT : ""].filter(Boolean).join("\n\n");
  if (sys) history.unshift({ role: "system", content: sys });
  const body = {
    messages: history, stream: true, stream_options: { include_usage: true },
    chat_template_kwargs: { enable_thinking: thinking }, // explicit, so a server started with --no-think still follows the switch
    temperature: Number($("temp").value) || 0, max_tokens: Number($("maxTokens").value) || 2048,
  };

  const t0 = performance.now();
  let raw = "", firstAt = null, usage = null, finish = null, lastMood = null, tool = null;
  let tagChunks = 0, tagLoop = false; // small models can repeat the mood tags instead of answering
  const stamps = []; // token arrival times, for the live speed
  try {
    const r = await fetch("/v1/chat/completions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: busy.signal });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || `HTTP ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!ev.startsWith("data: ")) continue;
        const data = ev.slice(6);
        if (data === "[DONE]") continue;
        const ch0 = JSON.parse(data);
        if (ch0.error) throw new Error(ch0.error.message);
        if (ch0.usage) usage = ch0.usage;
        const ch = ch0.choices && ch0.choices[0];
        if (!ch) continue;
        if (ch.finish_reason) finish = ch.finish_reason;
        const delta = ch.delta || {};
        if (delta.tool_calls) { // the model is calling a tool: hold up the magnifier while it does
          tool = delta.tool_calls[0]?.function?.name || tool || "a tool";
          mood("tool", `Using ${tool}`);
          continue;
        }
        if (!delta.content) continue;
        const now = performance.now();
        if (firstAt === null) firstAt = now;
        stamps.push(now);
        while (stamps.length && now - stamps[0] > 1000) stamps.shift();
        const rate = stamps.length > 1 ? (stamps.length - 1) / ((now - stamps[0]) / 1000) : 0;
        ghost?.rate(rate);
        $("speed").textContent = rate ? `${rate.toFixed(0)} tok/s` : "";
        raw += delta.content;
        split(raw, reply, t0);
        if (reply.think !== undefined && reply.thinkSecs === undefined) mood("thinking"); // reasoning before the answer
        else {
          const { shown, last } = moodOf(reply.answer || "", true);
          if (last) lastMood = last;
          reply.content = shown;
          if (shown.trim()) { ghost?.token(); mood(TALKING_FACE[lastMood] || "talking", "Writing"); }
          else if (lastMood && ++tagChunks > 48) { tagLoop = true; busy.abort(); }
        }
        draw(el, reply);
      }
    }
    const { shown } = moodOf(reply.answer || "", false);
    reply.content = shown;
    reply.sent = reply.answer || ""; // with its tags, as the model wrote it
    const secs = (performance.now() - (firstAt ?? t0)) / 1000;
    if (usage) {
      const rate = usage.completion_tokens / Math.max(secs, 1e-3);
      reply.meta = `${usage.completion_tokens} tokens in ${secs.toFixed(1)} s, ${rate.toFixed(1)} tok/s, first token after ${((firstAt ?? t0) - t0).toFixed(0)} ms` + (finish === "length" ? ", stopped at the length limit" : "");
    }
    if (finish === "tool_calls") settleTo("tool", 3000, `Asked to use ${tool}`);
    else settleTo(AFTER_FACE[lastMood] || "happy", lastMood && !["happy", "neutral"].includes(lastMood) ? 5000 : 2200);
  } catch (e) {
    if (tagLoop) {
      reply.content = "";
      reply.error = "This model kept repeating the ghost's mood tags instead of answering. Turn off \"Let the model set the ghost's mood\" in Reply settings, then try again.";
      settleTo("confused", 8000, "Stuck on mood tags", true);
    } else if (e.name === "AbortError") { reply.meta = "stopped"; settleTo("idle", 10); }
    else {
      // a network failure (the browser only says "Failed to fetch"): say what it means
      reply.error = e instanceof TypeError ? "Can't reach the server. Check that ghost-infer serve is still running, then try again." : String(e.message || e);
      settleTo("confused", 5000, "Couldn't answer", true);
    }
  } finally {
    if (reply.think !== undefined && reply.thinkSecs === undefined) reply.thinkSecs = (performance.now() - t0) / 1000;
    busy = null;
    ghost?.rate(0);
    $("speed").textContent = "";
    setBusy(false);
    save();
    draw(el, reply, true);
  }
}

function setBusy(on) {
  const b = $("sendBtn");
  b.classList.toggle("stop", on);
  b.setAttribute("aria-label", on ? "Stop the reply" : "Send");
  $("sendIcon").innerHTML = on ? '<rect x="4.5" y="4.5" width="9" height="9" rx="2" fill="currentColor"/>'
                               : '<path d="M9 14V4M4.5 8.5 9 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  canSend();
}
const input = $("input");
const canSend = () => { $("sendBtn").disabled = !busy && (!input.value.trim() || !!loadingModel); };
const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, innerHeight * 0.4) + "px"; };
function typed() {
  grow(); canSend();
  if (busy) return;
  clearTimeout(settle);
  mood(input.value.trim() ? "listening" : "idle");
}
input.addEventListener("input", typed);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } });
$("form").onsubmit = (e) => {
  e.preventDefault();
  if (busy) { busy.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  grow(); canSend();
  send(text);
};

// without 3D (no WebGL), the status sits alone above the box
if (!ghost) { $("ghost").remove(); document.body.classList.add("noghost"); }
renderChats();
renderAll();
settleTo("wave", 2400);
input.focus();
</script>
</body>
</html>
