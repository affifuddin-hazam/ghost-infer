<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>betterllama</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
    --accent: #2f6fde; --accent-text: #ffffff; --user: #e9eefb; --code: #f0f0ed; --danger: #c43d3d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --accent: #5b8ff0; --accent-text: #0e1117; --user: #26304a; --code: #2a2a2f; --danger: #e06c6c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .name { font-weight: 600; }
  header .model { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.stop { background: var(--danger); color: #fff; border-color: var(--danger); }
  #settings {
    display: none; gap: 14px; flex-wrap: wrap; align-items: center; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); font-size: 14px;
  }
  #settings.open { display: flex; }
  #settings label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #settings input[type=number] { width: 80px; }
  #settings input[type=text] { width: min(420px, 80vw); }
  input, textarea {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px;
  }
  main { flex: 1; overflow-y: auto; }
  #log { max-width: 820px; margin: 0 auto; padding: 20px 16px 8px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  .msg { margin: 0 0 18px; }
  .msg.user .bubble {
    background: var(--user); border-radius: 14px; padding: 9px 14px; margin-left: auto; max-width: 85%;
    width: fit-content; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.assistant .bubble { padding: 2px 2px; word-wrap: break-word; }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 1.05em; margin: 14px 0 6px; }
  .bubble ul, .bubble ol { margin: 4px 0 10px; padding-left: 22px; }
  .bubble code { background: var(--code); border-radius: 4px; padding: 1px 4px; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .bubble pre { background: var(--code); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 6px 0 10px; }
  .bubble pre code { background: none; padding: 0; }
  details.think {
    border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 0 0 10px; color: var(--muted); font-size: 14px;
  }
  details.think summary { cursor: pointer; user-select: none; }
  details.think .body { white-space: pre-wrap; margin-top: 6px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .error { color: var(--danger); }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  #form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; max-height: 40vh; min-height: 42px; }
  .hint { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="name">betterllama</span>
  <span class="model" id="model">connecting…</span>
  <button id="settingsBtn" title="Settings">Settings</button>
  <button id="newBtn" title="Start a new conversation">New chat</button>
</header>
<div id="settings">
  <label><input type="checkbox" id="think" checked> Thinking</label>
  <label>Temperature <input type="number" id="temp" min="0" max="2" step="0.1" value="0"></label>
  <label>Max tokens <input type="number" id="maxTokens" min="1" step="64" value="2048"></label>
  <label>System prompt <input type="text" id="system" placeholder="(the model's default)"></label>
</div>
<main id="scroller"><div id="log"></div></main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message" autofocus></textarea>
    <button type="submit" class="primary" id="sendBtn">Send</button>
  </form>
  <div class="hint">Enter to send, Shift+Enter for a new line. Temperature 0 is fastest (it uses the draft model if the server has one).</div>
</footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("betterllama." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("betterllama." + k, JSON.stringify(v)); } catch {} },
};
let messages = store.get("messages", []); // {role, content, think?, thinkSecs?, meta?}
let busy = null; // AbortController of the running request

for (const [id, key] of [["think", "think"], ["temp", "temp"], ["maxTokens", "maxTokens"], ["system", "system"]]) {
  const el = $(id), saved = store.get(key, null);
  if (saved !== null) el.type === "checkbox" ? (el.checked = saved) : (el.value = saved);
  el.addEventListener("change", () => store.set(key, el.type === "checkbox" ? el.checked : el.value));
}
$("settingsBtn").onclick = () => $("settings").classList.toggle("open");
$("newBtn").onclick = () => { if (busy) busy.abort(); messages = []; save(); render(); $("input").focus(); };

fetch("/v1/models").then((r) => r.json()).then((j) => { $("model").textContent = j.data[0].id; })
  .catch(() => { $("model").textContent = "server not reachable"; });

function save() { store.set("messages", messages); }

// ---- a small Markdown renderer (escaped first, so model output can never become HTML)
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function markdown(src) {
  const out = [];
  const parts = src.split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) { // a code block (possibly still open while streaming)
      const nl = part.indexOf("\n");
      const code = nl >= 0 ? part.slice(nl + 1) : "";
      out.push("<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>");
      return;
    }
    let list = null;
    const close = () => { if (list) { out.push("</" + list + ">"); list = null; } };
    let para = [];
    const flush = () => { if (para.length) { out.push("<p>" + inline(esc(para.join("\n"))).replace(/\n/g, "<br>") + "</p>"); para = []; } };
    for (const line of part.split("\n")) {
      let m;
      if (!line.trim()) { flush(); close(); continue; }
      if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flush(); close(); const n = Math.min(m[1].length, 3); out.push(`<h${n}>${inline(esc(m[2]))}</h${n}>`); continue; }
      if ((m = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)/))) {
        flush();
        const kind = /\d/.test(m[1]) ? "ol" : "ul";
        if (list !== kind) { close(); out.push("<" + kind + ">"); list = kind; }
        out.push("<li>" + inline(esc(m[2])) + "</li>");
        continue;
      }
      close();
      para.push(line);
    }
    flush(); close();
  });
  return out.join("");
}

// ---- the conversation
function render() {
  const log = $("log");
  log.innerHTML = "";
  if (!messages.length) { log.innerHTML = '<div class="empty">Ask anything. Replies run on your own GPU.</div>'; return; }
  messages.forEach((m, i) => log.appendChild(view(m, i === messages.length - 1 && busy)));
  $("scroller").scrollTop = $("scroller").scrollHeight;
}

function view(m, live) {
  const div = document.createElement("div");
  div.className = "msg " + m.role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (m.role === "user") {
    bubble.textContent = m.content;
  } else {
    if (m.think !== undefined && (m.think.trim() || live)) {
      const d = document.createElement("details");
      d.className = "think";
      d.open = !!m.thinkOpen;
      d.ontoggle = () => { m.thinkOpen = d.open; };
      const s = document.createElement("summary");
      s.textContent = m.thinkSecs === undefined ? "Thinking…" : `Thought for ${m.thinkSecs.toFixed(1)} s`;
      const b = document.createElement("div");
      b.className = "body";
      b.textContent = m.think.trim();
      d.append(s, b);
      bubble.appendChild(d);
    }
    const body = document.createElement("div");
    body.innerHTML = markdown(m.content);
    if (live && m.thinkSecs !== undefined) body.classList.add("cursor");
    if (live && m.think === undefined) body.classList.add("cursor");
    bubble.appendChild(body);
    if (m.error) { const e = document.createElement("div"); e.className = "error"; e.textContent = m.error; bubble.appendChild(e); }
  }
  div.appendChild(bubble);
  if (m.meta) { const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = m.meta; div.appendChild(meta); }
  return div;
}

// splits the raw reply into a <think> part and the answer
function split(raw, m, t0) {
  const open = raw.indexOf("<think>");
  if (open < 0 || raw.slice(0, open).trim()) { m.content = raw; return; }
  const close = raw.indexOf("</think>");
  if (close < 0) { m.think = raw.slice(open + 7); m.content = ""; return; }
  m.think = raw.slice(open + 7, close);
  if (m.thinkSecs === undefined) m.thinkSecs = (performance.now() - t0) / 1000;
  m.content = raw.slice(close + 8).replace(/^\s+/, "");
}

async function send(text) {
  const think = $("think").checked;
  // `sent` is what the model reads; resending exactly that keeps the server's cache of the conversation valid
  messages.push({ role: "user", content: text, sent: think ? text : text + " /no_think" });
  const reply = { role: "assistant", content: "" };
  messages.push(reply);
  busy = new AbortController();
  setBusy(true);
  render();

  // earlier replies go back without their thinking, as Qwen3 expects
  const history = messages.slice(0, -1).map((m) => ({ role: m.role, content: m.sent ?? m.content }));
  const sys = $("system").value.trim();
  if (sys) history.unshift({ role: "system", content: sys });
  const body = {
    messages: history, stream: true, stream_options: { include_usage: true },
    chat_template_kwargs: { enable_thinking: think }, // explicit, so a server started with --no-think still follows the switch
    temperature: Number($("temp").value) || 0, max_tokens: Number($("maxTokens").value) || 2048,
  };

  const t0 = performance.now();
  let raw = "", firstAt = null, usage = null, finish = null;
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: busy.signal,
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || `HTTP ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!ev.startsWith("data: ")) continue;
        const data = ev.slice(6);
        if (data === "[DONE]") continue;
        const c = JSON.parse(data);
        if (c.error) throw new Error(c.error.message);
        if (c.usage) usage = c.usage;
        const ch = c.choices && c.choices[0];
        if (!ch) continue;
        if (ch.finish_reason) finish = ch.finish_reason;
        if (ch.delta && ch.delta.content) {
          if (firstAt === null) firstAt = performance.now();
          raw += ch.delta.content;
          split(raw, reply, t0);
          render();
        }
      }
    }
    const secs = (performance.now() - (firstAt ?? t0)) / 1000;
    if (usage) {
      const rate = usage.completion_tokens / Math.max(secs, 1e-3);
      reply.meta = `${usage.completion_tokens} tokens · ${rate.toFixed(1)} tok/s · first token after ${((firstAt ?? t0) - t0).toFixed(0)} ms` + (finish === "length" ? " · stopped at the token limit" : "");
    }
  } catch (e) {
    if (e.name === "AbortError") reply.meta = "stopped";
    else reply.error = String(e.message || e);
  } finally {
    if (reply.think !== undefined && reply.thinkSecs === undefined) reply.thinkSecs = (performance.now() - t0) / 1000;
    busy = null;
    setBusy(false);
    save();
    render();
  }
}

function setBusy(on) {
  const b = $("sendBtn");
  b.textContent = on ? "Stop" : "Send";
  b.className = on ? "stop" : "primary";
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  if (busy) { busy.abort(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  grow();
  send(text);
};
const grow = () => { const t = $("input"); t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; };
$("input").addEventListener("input", grow);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
render();
</script>
</body>
</html>
